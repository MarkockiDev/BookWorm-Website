<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Page not found · BookWorm</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/favicon-192.png" type="image/png" sizes="192x192">
<style>
:root { --paper:#FAF6EF; --ink:#2C1810; --ink-2:#5E4536; --btn-bg:#2F7A4C; --btn-fg:#fff; }
@media (prefers-color-scheme: dark) { :root { --paper:#0C0C0C; --ink:#F5F1EA; --ink-2:#CFC6BB; --btn-bg:#4CAF72; --btn-fg:#0B1F13; } }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--paper); color:var(--ink); font:400 1.0625rem/1.6 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; text-align:center; }
img { width:180px; height:auto; margin:0 auto; display:block; }
h1 { font:700 clamp(2.2rem, 8vw, 3.2rem)/1.05 ui-serif, "New York", Georgia, serif; letter-spacing:-.02em; margin:8px 0 0; }
p { color:var(--ink-2); margin:14px auto 28px; max-width:30ch; }
a { display:inline-flex; align-items:center; min-height:44px; padding:0 22px; border-radius:999px; background:var(--btn-bg); color:var(--btn-fg); font-weight:600; text-decoration:none; }
a:focus-visible { outline:3px solid var(--btn-bg); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <img src="/assets/worm-sleeping.png" width="480" height="480" alt="">
  <h1>This page is still asleep.</h1>
  <p>We couldn't find what you were looking for. The rest of the library is awake, though.</p>
  <a href="/">Back to BookWorm</a>
</main>
</body>
</html>
